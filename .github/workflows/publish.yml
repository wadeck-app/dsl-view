name: CI / Publish

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build dsl-renderer
              run: npm run build --workspace=packages/dsl-renderer

            - name: Build dsl-ui
              run: npm run build --workspace=packages/dsl-ui

            - name: Run tests
              run: npm test --workspaces --if-present

    publish:
        needs: build-and-test
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build dsl-renderer
              run: npm run build --workspace=packages/dsl-renderer

            - name: Build dsl-ui
              run: npm run build --workspace=packages/dsl-ui

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            - name: Set version in packages
              run: |
                  npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/dsl-renderer
                  npm pkg set version="${{ steps.version.outputs.version }}" --workspace=packages/dsl-ui

            # The version is derived from the commit only (date, commit count, short sha), so two runs
            # on the same sha compute the same version and the second one would fail with E409.
            # Publish a package only when that exact version is not on the registry yet; any registry
            # error other than "not found" fails the step (no silent skip).
            - name: Publish packages (idempotent)
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
                  DIST_TAG: ${{ steps.version.outputs.dist_tag }}
              run: |
                  set -uo pipefail
                  for workspace in packages/dsl-renderer packages/dsl-ui; do
                      name=$(node -p "require('./$workspace/package.json').name")
                      if found=$(npm view "$name@$VERSION" version 2>/tmp/npm-view-err); then
                          if [ "$found" = "$VERSION" ]; then
                              echo "::notice title=Already published::$name@$VERSION is already on the registry (another run on this commit published it); skipping."
                              continue
                          fi
                      elif ! grep -q "E404" /tmp/npm-view-err; then
                          echo "::error::Could not check whether $name@$VERSION exists (not a 404):"
                          cat /tmp/npm-view-err
                          exit 1
                      fi
                      npm publish --workspace="$workspace" --tag "$DIST_TAG" || exit 1
                  done
