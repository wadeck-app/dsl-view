# Overview: what this module shows and where to look. Hand-written; the component pages are generated.
$sources:
  assets:
    url: GET /api/modules/showcase/assets

$type: VerticalStack
items:
  - $type: PageHeader
    title: dsl-view showcase
    subtitle: Every dsl-ui component with live controls, plus a small equipment-loan app built only from YAML.
  - $type: HorizontalStack
    wrap: true
    items:
      - $type: StatTile
        label: Demo assets
        value: $sources.assets.items.length
  - $type: Card
    header:
      - $type: Tag
        label: Equipment loans
    items:
      - $type: Markdown
        text: |
          A fictional domain that lives only in this module. Open **Assets** to see a table with row actions, a create/edit dialog and a delete confirmation; click a row for the edit page, which demonstrates optimistic locking (`version`, HTTP 409, a button that simulates another user saving).
      - $type: ButtonLink
        to: /modules/showcase/assets
        label: Open Assets
  - $type: Card
    header:
      - $type: Tag
        label: Components
    items:
      - $type: Markdown
        text: |
          One page per folder of dsl-ui (controls, display, form, layout, navigation, overlay, table, dev). Each component sits in a frame that names it (registry name, category, folder). When the component has simple props, controls under the frame change them live; the table lists every prop and its type. A frame marked "Not playable yet" needs a sample in `showcase/scripts/samples.json`.
      - $type: ButtonLink
        to: /modules/showcase/components/display
        label: Open Display
