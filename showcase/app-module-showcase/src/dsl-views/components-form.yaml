      - $type: "Tag"
        label: "ButtonCancel"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "form"
    items:
      - $type: "Markdown"
        text: "Cancel button for a form's action row; calls onCancel when clicked."
