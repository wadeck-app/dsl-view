        wrap: true
        items:
          - $type: "Switch"
            label: "disabled"
            bind: "ButtonCancel__disabled"
      - $type: "ButtonCancel"
        disabled: "$vars.ButtonCancel__disabled"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `label` | string | no |\n| `disabled` | boolean | no |\n| `disabledReason` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "ButtonSubmit"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "form"
    items:
      - $type: "Markdown"
        text: "Submit button that follows the form: off with the first error as its reason while an error blocks the form, `pendingLabel` while the save runs, on with the warning count; enabled with nothing modified unless `requireChanges` (a confirm-delete form has no field). Pick it over `ButtonSave` when the form is not a plain \"save my edits\"."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldSelect"
            label: "variant"
            bind: "ButtonSubmit__variant"
            options:
              - value: "primary"
                label: "primary"
              - value: "danger"
                label: "danger"
              - value: "success"
                label: "success"
              - value: "secondary"
                label: "secondary"
          - $type: "Switch"
            label: "requireChanges"
            bind: "ButtonSubmit__requireChanges"
          - $type: "FieldSelect"
            label: "loadingStyle"
            bind: "ButtonSubmit__loadingStyle"
            options:
              - value: "spinner"
                label: "spinner"
              - value: "sweep"
                label: "sweep"
              - value: "dots"
                label: "dots"
              - value: "bar"
                label: "bar"
              - value: "pulse"
                label: "pulse"
              - value: "orbit"
                label: "orbit"
      - $type: "ButtonSubmit"
        variant: "$vars.ButtonSubmit__variant"
        requireChanges: "$vars.ButtonSubmit__requireChanges"
        loadingStyle: "$vars.ButtonSubmit__loadingStyle"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `label` | string | no |\n| `variant` | primary / danger / success / secondary | no |\n| `pendingLabel` | string | no |\n| `requireChanges` | boolean | no |\n| `loadingStyle` | spinner / sweep / dots / bar / pulse / orbit | no |"
