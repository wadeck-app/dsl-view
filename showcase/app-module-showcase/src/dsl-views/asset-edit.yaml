# Equipment-loan demo, edit page (route /assets/:id): a Form with optimistic locking.
# The asset carries `version`; the form sends it back (hidden field `version` of initialData), the backend answers 409
# when it moved. "Simulate another user" bumps the version so the next save fails; "Reload" re-reads the asset.
$sources:
  asset:
    url: GET /api/modules/showcase/assets/{id}
    params:
      id: $route.id

$actions:
  saveAsset:
    url: PATCH /api/modules/showcase/assets/{id}
    reloadSources: [asset]
    successMessage: Asset saved
  simulateOtherUser:
    url: POST /api/modules/showcase/assets/{id}/touch
    # reloadSources: [] keeps this page on the version it opened, as a second browser tab would: the next save is stale.
    reloadSources: []
    successMessage: Someone else saved this asset (version bumped)
  reloadAsset:
    resultKey: reloaded
    reloadSources: [asset]

$type: VerticalStack
items:
  - $type: PageHeader
    title: $sources.asset.name
    subtitle: Optimistic locking demo. Components used - Form, FieldText, FieldNumber, FieldSelect, FieldTags, FieldDate, UnsavedBadge, ButtonSave, ButtonCancel, ActionButton.
  - $type: Badge
    label: $concat('version ', $sources.asset.version)
    variant: info
  - $type: Form
    initialData: $sources.asset
    onSubmit: $saveAsset
    fields:
      - $type: FieldText
        label: Name
        bind: name
        required: true
      - $type: FieldText
        label: Category
        bind: category
      - $type: FieldSelect
        label: Status
        bind: status
        options:
          - { value: available, label: available }
          - { value: loaned, label: loaned }
          - { value: maintenance, label: maintenance }
      - $type: FieldNumber
        label: Quantity
        bind: quantity
        min: 0
    actions:
      # A/B (dev dock): how a button shows that its request is running. See ButtonSave.loadingStyle.
      - $type: AbTest
        id: save-wait
        label: Save button wait
        initial: spinner
        variants:
          spinner:
            label: Spinner
            hint: "Reference: the arc before the label (widens the button)."
            view:
              $type: ButtonSave
              label: Save
              loadingStyle: spinner
          sweep:
            label: Sweep
            hint: A soft band of light crosses the button; the label stays.
            view:
              $type: ButtonSave
              label: Save
              loadingStyle: sweep
          dots:
            label: Dots
            hint: The label gives way to three waving dots.
            view:
              $type: ButtonSave
              label: Save
              loadingStyle: dots
          bar:
            label: Bar
            hint: A thin line slides along the bottom edge.
            view:
              $type: ButtonSave
              label: Save
              loadingStyle: bar
          pulse:
            label: Pulse
            hint: The button breathes and a ring ripples out of it.
            view:
              $type: ButtonSave
              label: Save
              loadingStyle: pulse
          orbit:
            label: Orbit
            hint: A point of light travels around the border.
            view:
              $type: ButtonSave
              label: Save
              loadingStyle: orbit
      - $type: UnsavedBadge
  - $type: HorizontalStack
    items:
      - $type: AbTest
        id: action-wait
        label: Action button wait
        initial: spinner
        variants:
          spinner:
            label: Spinner
            hint: "Reference: the arc before the label (widens the button)."
            view:
              $type: ActionButton
              label: Simulate another user saving
              action: simulateOtherUser
              params:
                id: $route.id
              variant: secondary
              loadingStyle: spinner
          sweep:
            label: Sweep
            hint: A soft band of light crosses the button; the label stays.
            view:
              $type: ActionButton
              label: Simulate another user saving
              action: simulateOtherUser
              params:
                id: $route.id
              variant: secondary
              loadingStyle: sweep
          dots:
            label: Dots
            hint: The label gives way to three waving dots.
            view:
              $type: ActionButton
              label: Simulate another user saving
              action: simulateOtherUser
              params:
                id: $route.id
              variant: secondary
              loadingStyle: dots
          bar:
            label: Bar
            hint: A thin line slides along the bottom edge.
            view:
              $type: ActionButton
              label: Simulate another user saving
              action: simulateOtherUser
              params:
                id: $route.id
              variant: secondary
              loadingStyle: bar
          pulse:
            label: Pulse
            hint: The button breathes and a ring ripples out of it.
            view:
              $type: ActionButton
              label: Simulate another user saving
              action: simulateOtherUser
              params:
                id: $route.id
              variant: secondary
              loadingStyle: pulse
          orbit:
            label: Orbit
            hint: A point of light travels around the border.
            view:
              $type: ActionButton
              label: Simulate another user saving
              action: simulateOtherUser
              params:
                id: $route.id
              variant: secondary
              loadingStyle: orbit
      - $type: ActionButton
        label: Reload
        action: reloadAsset
        variant: secondary
