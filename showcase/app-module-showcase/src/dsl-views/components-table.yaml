# GENERATED by scripts/generate-views.mjs, do not edit. Change samples.json or the generator, then regenerate.
$vars:
  BulkActionsToolbar__selectedCount: 1
  DataTable__loading: false
  DataTable__refreshing: false
  DataTable__sortDir: "asc"
  DataTable__selectable: false
  DataTable__batchActionsPosition: "floating"
  DataTable__fontMono: false
  DataTable__fill: false
  FilterChips__bind: "sample"
  FilterChips__mode: "multi"
  Pagination__total: 1
  Pagination__size: 1
  SearchBar__focusExpand: false
  SearchBar__size: "sm"
  SortableColumn__label: "SortableColumn"
  SortableColumn__sortKey: "sample"

$type: "VerticalStack"
items:
  - $type: "PageHeader"
    title: "Components: table"
    subtitle: "7 components, generated by scripts/generate-views.mjs from inventory.md and the node schemas"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "BulkActionsToolbar"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "table"
    items:
      - $type: "Markdown"
        text: "Toolbar showing \"N items selected\" with a Clear button and extra action children, hidden when nothing is selected; pick it above a selectable table."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldNumber"
            label: "selectedCount"
            bind: "BulkActionsToolbar__selectedCount"
      - $type: "BulkActionsToolbar"
        selectedCount: "$vars.BulkActionsToolbar__selectedCount"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `selectedCount` | number | yes |\n| `items` | array | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "DataTable"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "table"
    items:
      - $type: "Markdown"
        text: "Full data table with sorting, selection, batch actions, row actions, expandable rows, loading and empty states; pick it for any tabular list of records. The actions column is right-aligned and only as wide as its icons (give `width` to override); a batch action takes `variant` (default `secondary`; `danger-outline` for a destructive one, a row action icon too) and `keepSelection: true` to keep the selection after it (use it before a confirm); rows that leave the table drop out of the selection. The floating batch bar sits above the dev A/B dock (the dock publishes `--floating-bottom-offset`)."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: rows, columns)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `rows` | array | yes |\n| `columns` | array | yes |\n| `loading` | boolean | no |\n| `refreshing` | boolean | no |\n| `emptyMessage` | string | no |\n| `navigateTo` | string | no |\n| `filtersTop` | array | no |\n| `filters` | array | no |\n| `id` | string | no |\n| `rowKey` | string | no |\n| `sortCol` | string | no |\n| `sortDir` | asc / desc | no |\n| `defaultFilters` | record | no |\n| `expansion` | record | no |\n| `selectable` | boolean | no |\n| `batchActions` | array | no |\n| `actionPending` | record | no |\n| `actionPendingRows` | record | no |\n| `batchActionsPosition` | floating / bottom | no |\n| `expansionCondition` | string | no |\n| `expandLabel` | string | no |\n| `collapseLabel` | string | no |\n| `fontMono` | boolean | no |\n| `fill` | boolean | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "FilterBar"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "table"
    items:
      - $type: "Markdown"
        text: "Toolbar with a search box, filter chips and a Clear all button; pick it over SearchBar or FilterChips alone when both are needed."
      - $type: "FilterBar"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `search` | string | no |\n| `filters` | array | no |\n| `placeholder` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "FilterChips"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "table"
    items:
      - $type: "Markdown"
        text: "Row of toggle chips in multi mode (empty means all active) or single mode (exactly one active); pick it for a small set of filter values."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: options, value)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `bind` | string | yes |\n| `options` | array | yes |\n| `value` | array | yes |\n| `mode` | multi / single | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Pagination"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "table"
    items:
      - $type: "Markdown"
        text: "Previous/Next controls with a \"Page x / y\" label, driven by a URL search param or by page props; renders nothing with a single page."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldNumber"
            label: "total"
            bind: "Pagination__total"
          - $type: "FieldNumber"
            label: "size"
            bind: "Pagination__size"
      - $type: "Pagination"
        total: "$vars.Pagination__total"
        size: "$vars.Pagination__size"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `urlParam` | string | no |\n| `page` | number | no |\n| `total` | number | yes |\n| `size` | number | yes |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "SearchBar"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "table"
    items:
      - $type: "Markdown"
        text: "Debounced text search input, backed by a URL search param or by value/onChange, with optional focus expansion and sm size."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "Switch"
            label: "focusExpand"
            bind: "SearchBar__focusExpand"
          - $type: "FieldSelect"
            label: "size"
            bind: "SearchBar__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
      - $type: "SearchBar"
        urlParam: "q"
        focusExpand: "$vars.SearchBar__focusExpand"
        size: "$vars.SearchBar__size"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `urlParam` | string | no |\n| `resetUrlParams` | array | no |\n| `value` | string | no |\n| `placeholder` | string | no |\n| `debounceMs` | number | no |\n| `focusExpand` | boolean | no |\n| `size` | sm / md | no |\n| `inputRef` | unknown | no |\n| `onKeyDown` | unknown | no |\n| `ariaControls` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "SortableColumn"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "table"
    items:
      - $type: "Markdown"
        text: "Table header cell (th) with a sort button and direction icon plus aria-sort; pick it to build a sortable column header by hand."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "label"
            bind: "SortableColumn__label"
          - $type: "FieldText"
            label: "sortKey"
            bind: "SortableColumn__sortKey"
      - $type: "SortableColumn"
        label: "$vars.SortableColumn__label"
        sortKey: "$vars.SortableColumn__sortKey"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `label` | string | yes |\n| `sortKey` | string | yes |\n| `currentSort` | object | no |"
