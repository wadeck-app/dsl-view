# GENERATED by scripts/generate-views.mjs, do not edit. Change samples.json or the generator, then regenerate.
$vars:
  ConfirmDialog__open: false
  ConfirmDialog__title: "ConfirmDialog"
  ConfirmDialog__confirmVariant: "danger"
  ContextMenu__side: "top"
  ContextMenu__align: "start"
  ContextMenu__open: false
  Dialog__title: "Dialog"
  Dialog__open: false
  Dialog__size: "sm"
  DialogForm__title: "DialogForm"
  DialogForm__size: "sm"
  Drawer__open: false
  Drawer__side: "left"
  Drawer__size: "sm"
  Drawer__hideCloseButton: false
  Popover__side: "top"
  Popover__align: "start"
  Popover__open: false
  Tooltip__content: "sample"

$type: "VerticalStack"
items:
  - $type: "PageHeader"
    title: "Components: overlay"
    subtitle: "8 components, generated by scripts/generate-views.mjs from inventory.md and the node schemas"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "ConfirmDialog"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "overlay"
    items:
      - $type: "Markdown"
        text: "Small Dialog with a message, a Cancel button and a confirm button (danger by default); pick it over Dialog for a yes/no confirmation."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "Switch"
            label: "open"
            bind: "ConfirmDialog__open"
          - $type: "FieldText"
            label: "title"
            bind: "ConfirmDialog__title"
          - $type: "FieldSelect"
            label: "confirmVariant"
            bind: "ConfirmDialog__confirmVariant"
            options:
              - value: "danger"
                label: "danger"
              - value: "primary"
                label: "primary"
      - $type: "ConfirmDialog"
        open: "$vars.ConfirmDialog__open"
        title: "$vars.ConfirmDialog__title"
        confirmVariant: "$vars.ConfirmDialog__confirmVariant"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `open` | boolean | yes |\n| `title` | string | yes |\n| `message` | array | no |\n| `confirmLabel` | string | no |\n| `confirmVariant` | danger / primary | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "ContextMenu"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "overlay"
    items:
      - $type: "Markdown"
        text: "Popover menu of clickable items (icon, danger, separator) opened by a trigger element; pick it for a kebab or row action menu."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: items)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `trigger` | array | no |\n| `items` | array | yes |\n| `side` | top / right / bottom / left | no |\n| `align` | start / center / end | no |\n| `open` | boolean | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Dialog"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "overlay"
    items:
      - $type: "Markdown"
        text: "Modal dialog with title, focus trap, optional trigger and actions footer, in four sizes (initial focus: an element marked `data-autofocus`, else a field that took it itself, else the first control); pick it for custom content, ConfirmDialog or DialogForm for ready-made ones."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "title"
            bind: "Dialog__title"
          - $type: "Switch"
            label: "open"
            bind: "Dialog__open"
          - $type: "FieldSelect"
            label: "size"
            bind: "Dialog__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
              - value: "lg"
                label: "lg"
              - value: "xl"
                label: "xl"
      - $type: "Dialog"
        title: "$vars.Dialog__title"
        open: "$vars.Dialog__open"
        size: "$vars.Dialog__size"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `title` | string | yes |\n| `trigger` | array | no |\n| `open` | boolean | no |\n| `items` | array | no |\n| `actions` | array | no |\n| `size` | sm / md / lg / xl | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "DialogForm"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "overlay"
    items:
      - $type: "Markdown"
        text: "Dialog wrapping a Form with Save and Cancel, in create or edit mode depending on initialData.id; pick it to create or edit a record. Closes only through `onClose` (YAML: `onClose: $closeX` with an action `{ resultKey, clear: true }`)."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: visible)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `title` | string | yes |\n| `visible` | unknown | yes |\n| `initialData` | record | no |\n| `fields` | array | no |\n| `size` | sm / md / lg / xl | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Drawer"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "overlay"
    items:
      - $type: "Markdown"
        text: "Modal side panel sliding from left, right or bottom with optional title, footer and close button (same initial focus rule as Dialog); pick it over Dialog for a larger contextual panel."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "Switch"
            label: "open"
            bind: "Drawer__open"
          - $type: "FieldSelect"
            label: "side"
            bind: "Drawer__side"
            options:
              - value: "left"
                label: "left"
              - value: "right"
                label: "right"
              - value: "bottom"
                label: "bottom"
          - $type: "FieldSelect"
            label: "size"
            bind: "Drawer__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
              - value: "lg"
                label: "lg"
          - $type: "Switch"
            label: "hideCloseButton"
            bind: "Drawer__hideCloseButton"
      - $type: "Drawer"
        open: "$vars.Drawer__open"
        side: "$vars.Drawer__side"
        size: "$vars.Drawer__size"
        hideCloseButton: "$vars.Drawer__hideCloseButton"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `open` | boolean | yes |\n| `side` | left / right / bottom | no |\n| `title` | string | no |\n| `footer` | array | no |\n| `items` | array | no |\n| `size` | sm / md / lg | no |\n| `hideCloseButton` | boolean | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Popover"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "overlay"
    items:
      - $type: "Markdown"
        text: "Floating panel of interactive content anchored to a trigger element, controlled or not; pick it over Tooltip when the content has controls, over ContextMenu when it is not a list of actions."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldSelect"
            label: "side"
            bind: "Popover__side"
            options:
              - value: "top"
                label: "top"
              - value: "right"
                label: "right"
              - value: "bottom"
                label: "bottom"
              - value: "left"
                label: "left"
          - $type: "FieldSelect"
            label: "align"
            bind: "Popover__align"
            options:
              - value: "start"
                label: "start"
              - value: "center"
                label: "center"
              - value: "end"
                label: "end"
          - $type: "Switch"
            label: "open"
            bind: "Popover__open"
      - $type: "Popover"
        side: "$vars.Popover__side"
        align: "$vars.Popover__align"
        open: "$vars.Popover__open"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `trigger` | array | no |\n| `items` | array | no |\n| `side` | top / right / bottom / left | no |\n| `align` | start / center / end | no |\n| `open` | boolean | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "ToastProvider"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "overlay"
    items:
      - $type: "Markdown"
        text: "Provider that renders toast notifications (success, error, info) for its children; success and info auto-dismiss, errors stay until dismissed."
      - $type: "ToastProvider"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `items` | array | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Tooltip"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "overlay"
    items:
      - $type: "Markdown"
        text: "Hover and focus text bubble shown above a single wrapped element, linked via aria-describedby; pick it for a short hint, Popover for interactive content."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "content"
            bind: "Tooltip__content"
      - $type: "Tooltip"
        content: "$vars.Tooltip__content"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `content` | string | yes |\n| `items` | array | no |"
