# GENERATED by scripts/generate-views.mjs, do not edit. Change samples.json or the generator, then regenerate.
$vars:
  Avatar__fallback: "AL"
  Avatar__size: "sm"
  Notice__label: "Notice"
  Badge__label: "Badge"
  Badge__variant: "default"
  Badge__tone: "solid"
  Badge__size: "sm"
  Badge__href: "/"
  Badge__external: false
  Chart__xAxisKey: "sample"
  Chart__xAxisType: "time"
  Chart__variant: "default"
  Chart__showLegend: false
  Chart__fill: false
  DateText__relative: false
  FetchSpinner__loading: false
  Markdown__collapsed: false
  Markdown__allowImages: false
  PageHeader__title: "PageHeader"
  PageHeader__size: "default"
  Progress__value: 40
  Progress__variant: "default"
  Progress__showValue: false
  Progress__size: "sm"
  Progress__layout: "stacked"
  Progress__valueLabel: "sample"
  RelativeDate__live: false
  RelativeDate__tooltip: false
  Skeleton__width: "sample"
  Skeleton__height: "sample"
  Skeleton__variant: "line"
  Skeleton__count: 3
  Skeleton__decorative: false
  SparklineView__ariaLabel: "sample"
  Spinner__size: "sm"
  Tag__label: "Tag"
  Tag__color: "default"
  TimeBrush__valueKey: "sample"
  TimeBrush__kind: "line"
  TimeSeriesChart__yFormat: "number"
  TimeSeriesChart__yIncludeZero: false
  TimeSeriesChart__xFormat: "date"
  TimeSeriesChart__yRightFormat: "number"
  TimeSeriesChart__yRightIncludeZero: false

$type: "VerticalStack"
items:
  - $type: "PageHeader"
    title: "Components: display"
    subtitle: "19 components, generated by scripts/generate-views.mjs from inventory.md and the node schemas"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Avatar"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Round user image with a text fallback (given, or first two characters of alt, or '?') in sm, md or lg size."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "fallback"
            bind: "Avatar__fallback"
          - $type: "FieldSelect"
            label: "size"
            bind: "Avatar__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
              - value: "lg"
                label: "lg"
      - $type: "Avatar"
        fallback: "$vars.Avatar__fallback"
        size: "$vars.Avatar__size"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `src` | string | no |\n| `alt` | string | no |\n| `fallback` | string | no |\n| `size` | sm / md / lg | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Notice"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Short message that wraps (status role, alert for danger), same `label`/`variant` as Badge; a long message is clamped to three lines behind Show more; pick it for the feedback of an action in a narrow column where Badge would overflow."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "label"
            bind: "Notice__label"
      - $type: "Notice"
        label: "$vars.Notice__label"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `label` | string | yes |\n| `variant` | unknown | no |\n| `showMoreLabel` | string | no |\n| `showLessLabel` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Badge"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Rounded status pill with variant colours, solid or subtle tone, optionally a link or removable (`onRemove: $action`: inset ring in its variant colour so the height stays that of other badges, a cross that becomes a solid disc on hover); `title` is the tooltip of the whole badge; use for a status value, Tag for free-form labels."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "label"
            bind: "Badge__label"
          - $type: "FieldSelect"
            label: "variant"
            bind: "Badge__variant"
            options:
              - value: "default"
                label: "default"
              - value: "primary"
                label: "primary"
              - value: "success"
                label: "success"
              - value: "warning"
                label: "warning"
              - value: "danger"
                label: "danger"
              - value: "info"
                label: "info"
          - $type: "FieldSelect"
            label: "tone"
            bind: "Badge__tone"
            options:
              - value: "solid"
                label: "solid"
              - value: "subtle"
                label: "subtle"
          - $type: "FieldSelect"
            label: "size"
            bind: "Badge__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
          - $type: "FieldText"
            label: "href"
            bind: "Badge__href"
          - $type: "Switch"
            label: "external"
            bind: "Badge__external"
      - $type: "Badge"
        label: "$vars.Badge__label"
        variant: "$vars.Badge__variant"
        tone: "$vars.Badge__tone"
        size: "$vars.Badge__size"
        href: "$vars.Badge__href"
        external: "$vars.Badge__external"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `label` | string | yes |\n| `variant` | default / primary / success / warning / danger / info | no |\n| `tone` | solid / subtle | no |\n| `size` | sm / md | no |\n| `href` | string | no |\n| `external` | boolean | no |\n| `removeLabel` | string | no |\n| `title` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Chart"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Recharts line, bar and area chart from source rows with time or category x axis, dual y axes and sparkline variant; shows skeleton while data is undefined."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: series)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `data` | array | no |\n| `xAxisKey` | string | yes |\n| `xAxisType` | time / category | yes |\n| `xFormat` | unknown | no |\n| `yFormat` | unknown | no |\n| `yUnit` | string | no |\n| `variant` | default / sparkline | no |\n| `showLegend` | boolean | no |\n| `height` | number | no |\n| `fill` | boolean | no |\n| `series` | array | yes |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "DateText"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Plain text date or time formatted per the date settings with exact instant as tooltip; use for a static value, RelativeDate for a live 'ago' label."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: value)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `value` | unknown | yes |\n| `dateStyle` | unknown | no |\n| `part` | unknown | no |\n| `relative` | boolean | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "FetchSpinner"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Small spinning loader icon shown only while `loading` is true and rendering nothing otherwise; use inline next to content being fetched, Spinner for a standalone one."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "Switch"
            label: "loading"
            bind: "FetchSpinner__loading"
      - $type: "FetchSpinner"
        loading: "$vars.FetchSpinner__loading"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `loading` | boolean | yes |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "FigureRow"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Row of figures sharing the full width, each `value unit` on one line, with an optional trend arrow, a sparkline whose points can be inspected, and a drill-down link; pick it over a row of StatTile when a unit must stay beside the value, or for a trend over recent points."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: items)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `items` | array | yes |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "JsonViewer"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Monospace preformatted block showing a row field as pretty-printed JSON (raw text if not valid JSON), with optional max height scroll."
      - $type: "JsonViewer"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `row` | record | no |\n| `field` | string | no |\n| `maxHeight` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Markdown"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Safe markdown renderer (raw HTML as text, http/https/mailto links only, images off by default) with GFM tables, optional collapsed preview and max height."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "Switch"
            label: "collapsed"
            bind: "Markdown__collapsed"
          - $type: "Switch"
            label: "allowImages"
            bind: "Markdown__allowImages"
      - $type: "Markdown"
        collapsed: "$vars.Markdown__collapsed"
        allowImages: "$vars.Markdown__allowImages"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `text` | string | no |\n| `maxHeight` | string | no |\n| `collapsed` | boolean | no |\n| `allowImages` | boolean | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "PageHeader"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Page or section heading (h1, or h2 for size sm) with optional subtitle, icon or right-side header actions; not every layout renders all props."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "title"
            bind: "PageHeader__title"
          - $type: "FieldSelect"
            label: "size"
            bind: "PageHeader__size"
            options:
              - value: "default"
                label: "default"
              - value: "sm"
                label: "sm"
      - $type: "PageHeader"
        title: "$vars.PageHeader__title"
        size: "$vars.PageHeader__size"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `title` | string | yes |\n| `subtitle` | string | no |\n| `icon` | unknown | no |\n| `headerActions` | array | no |\n| `size` | default / sm | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "HeaderActions"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Page-header actions slot, React only: the host wraps the shell in `HeaderActionsProvider` and puts `HeaderActionsSlot` in the title row (it owns placement and `sticky`); a page or module renders `<HeaderActions>` with its chips or buttons and they appear there, no measuring or fixed offsets; nothing shown, and reported once, without a slot."
      - $type: "Markdown"
        text: "_No node schema shipped for HeaderActions: no controls, no live render yet._"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Progress"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Radix progress bar with variant colours, optional label and value text, stacked or inline layout; use for a known fraction, Spinner when unknown."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldNumber"
            label: "value"
            bind: "Progress__value"
          - $type: "FieldSelect"
            label: "variant"
            bind: "Progress__variant"
            options:
              - value: "default"
                label: "default"
              - value: "success"
                label: "success"
              - value: "danger"
                label: "danger"
          - $type: "Switch"
            label: "showValue"
            bind: "Progress__showValue"
          - $type: "FieldSelect"
            label: "size"
            bind: "Progress__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
          - $type: "FieldSelect"
            label: "layout"
            bind: "Progress__layout"
            options:
              - value: "stacked"
                label: "stacked"
              - value: "inline"
                label: "inline"
          - $type: "FieldText"
            label: "valueLabel"
            bind: "Progress__valueLabel"
      - $type: "Progress"
        value: "$vars.Progress__value"
        variant: "$vars.Progress__variant"
        showValue: "$vars.Progress__showValue"
        size: "$vars.Progress__size"
        layout: "$vars.Progress__layout"
        valueLabel: "$vars.Progress__valueLabel"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `value` | number | yes |\n| `max` | number | no |\n| `variant` | default / success / danger | no |\n| `label` | string | no |\n| `showValue` | boolean | no |\n| `size` | sm / md | no |\n| `layout` | stacked / inline | no |\n| `valueLabel` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "RelativeDate"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Text like '5 minutes ago' that updates every 60s by default, with exact timestamp tooltip; use instead of DateText for a live relative label."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: date)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `date` | unknown | yes |\n| `live` | boolean | no |\n| `tooltip` | boolean | no |\n| `format` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Skeleton"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Pulsing placeholder bar (line, circle or block), optionally repeated count times, for content that is still loading."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "width"
            bind: "Skeleton__width"
          - $type: "FieldText"
            label: "height"
            bind: "Skeleton__height"
          - $type: "FieldSelect"
            label: "variant"
            bind: "Skeleton__variant"
            options:
              - value: "line"
                label: "line"
              - value: "circle"
                label: "circle"
              - value: "block"
                label: "block"
          - $type: "FieldNumber"
            label: "count"
            bind: "Skeleton__count"
          - $type: "Switch"
            label: "decorative"
            bind: "Skeleton__decorative"
      - $type: "Skeleton"
        width: "$vars.Skeleton__width"
        height: "$vars.Skeleton__height"
        variant: "$vars.Skeleton__variant"
        count: "$vars.Skeleton__count"
        decorative: "$vars.Skeleton__decorative"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `width` | string | no |\n| `height` | string | no |\n| `variant` | line / circle / block | no |\n| `count` | number | no |\n| `decorative` | boolean | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "SparklineView"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Tiny line chart of recent points with gaps and a tooltip that follows the pointer, touch or arrow keys (focusable slider); pick it for an inline trend, Chart `variant: sparkline` for a full-size plot. Do not nest it in a link or button."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: points)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `points` | array | yes |\n| `ariaLabel` | string | yes |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Spinner"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Standalone spinning SVG loader in sm, md or lg size with optional visible label; use FetchSpinner for a small inline indicator."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldSelect"
            label: "size"
            bind: "Spinner__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
              - value: "lg"
                label: "lg"
      - $type: "Spinner"
        size: "$vars.Spinner__size"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `size` | sm / md / lg | no |\n| `label` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Tag"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Small rounded label with a colour palette and optional remove button; use for free-form labels, Badge for statuses."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "label"
            bind: "Tag__label"
          - $type: "FieldSelect"
            label: "color"
            bind: "Tag__color"
            options:
              - value: "default"
                label: "default"
              - value: "blue"
                label: "blue"
              - value: "green"
                label: "green"
              - value: "red"
                label: "red"
              - value: "yellow"
                label: "yellow"
              - value: "purple"
                label: "purple"
      - $type: "Tag"
        label: "$vars.Tag__label"
        color: "$vars.Tag__color"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `label` | string | yes |\n| `color` | default / blue / green / red / yellow / purple | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "TimeBrush"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Overview strip with zoom, pan and reset buttons for the `TimeSeriesChart`s of one `syncGroup`; drag the window to pan, drag an edge to resize, click to recentre. Give it the charts' `yAxisWidth` and `marginRight` so it lines up with their plots."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "valueKey"
            bind: "TimeBrush__valueKey"
          - $type: "FieldSelect"
            label: "kind"
            bind: "TimeBrush__kind"
            options:
              - value: "line"
                label: "line"
              - value: "bars"
                label: "bars"
      - $type: "TimeBrush"
        valueKey: "$vars.TimeBrush__valueKey"
        kind: "$vars.TimeBrush__kind"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `data` | array | no |\n| `xKey` | string | no |\n| `valueKey` | string | yes |\n| `kind` | line / bars | no |\n| `domain` | array | no |\n| `initialWindow` | array | no |\n| `syncGroup` | string | no |\n| `height` | number | no |\n| `yAxisWidth` | number | no |\n| `marginRight` | number | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "TimeSeriesChart"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "display"
    items:
      - $type: "Markdown"
        text: "Timestamp (ms) x axis with lines, areas, plain or floating bars, a second y axis, zone bands, dashed bridges over gaps, per-point colours, and a pan / zoom window (drag, Ctrl + wheel, keys) shared with the charts and brush of its `syncGroup`; stacked charts align to the pixel. Use `Chart` for category axes, sparklines, byte values or a quick single chart."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: series)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `data` | array | no |\n| `xKey` | string | no |\n| `domain` | array | no |\n| `initialWindow` | array | no |\n| `series` | array | yes |\n| `bands` | array | no |\n| `rangeAreas` | array | no |\n| `legendItems` | array | no |\n| `gapDashAfterDays` | number | no |\n| `syncGroup` | string | no |\n| `title` | string | no |\n| `height` | number | no |\n| `yUnit` | string | no |\n| `yFormat` | number / clock | no |\n| `yDecimals` | number | no |\n| `yIncludeZero` | boolean | no |\n| `yAxisWidth` | number | no |\n| `marginRight` | number | no |\n| `emptyMessage` | string | no |\n| `xFormat` | date / time / datetime | no |\n| `yRightFormat` | number / clock | no |\n| `yRightUnit` | string | no |\n| `yRightDecimals` | number | no |\n| `yRightIncludeZero` | boolean | no |\n| `yRightAxisWidth` | number | no |"
