# GENERATED by scripts/generate-views.mjs, do not edit. Change samples.json or the generator, then regenerate.
$vars:
  Breadcrumb__currentPath: "sample"
  ButtonLink__to: "sample"
  ButtonLink__label: "ButtonLink"
  ButtonLink__variant: "primary"
  ButtonLink__size: "sm"
  ButtonLink__disabled: false
  Link__href: "sample"
  Link__label: "Link"
  Link__external: false
  Link__variant: "default"

$type: "VerticalStack"
items:
  - $type: "PageHeader"
    title: "Components: navigation"
    subtitle: "9 components, generated by scripts/generate-views.mjs from inventory.md and the node schemas"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "BackLink"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Sticky \"Back\" link with an arrow that goes to a given route or one path segment up; pick it over Breadcrumb for a single return link."
      - $type: "BackLink"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `to` | string | no |\n| `label` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Breadcrumb"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Home button plus clickable path segments built from the current path, navigating through a callback; pick it to show where a nested path sits."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "currentPath"
            bind: "Breadcrumb__currentPath"
      - $type: "Breadcrumb"
        currentPath: "$vars.Breadcrumb__currentPath"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `currentPath` | string | yes |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "ButtonLink"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Router link styled as a button (an anchor, so middle-click works); pick it over a button when the action is a navigation to a route. `disabled` drops the destination and shows `disabledReason` in a tooltip."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "to"
            bind: "ButtonLink__to"
          - $type: "FieldText"
            label: "label"
            bind: "ButtonLink__label"
          - $type: "FieldSelect"
            label: "variant"
            bind: "ButtonLink__variant"
            options:
              - value: "primary"
                label: "primary"
              - value: "secondary"
                label: "secondary"
              - value: "danger"
                label: "danger"
              - value: "danger-outline"
                label: "danger-outline"
              - value: "neutral"
                label: "neutral"
              - value: "success"
                label: "success"
          - $type: "FieldSelect"
            label: "size"
            bind: "ButtonLink__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
          - $type: "Switch"
            label: "disabled"
            bind: "ButtonLink__disabled"
      - $type: "ButtonLink"
        to: "$vars.ButtonLink__to"
        label: "$vars.ButtonLink__label"
        variant: "$vars.ButtonLink__variant"
        size: "$vars.ButtonLink__size"
        disabled: "$vars.ButtonLink__disabled"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `to` | string | yes |\n| `label` | string | yes |\n| `icon` | array | no |\n| `variant` | primary / secondary / danger / danger-outline / neutral / success | no |\n| `size` | sm / md | no |\n| `disabled` | boolean | no |\n| `disabledReason` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Link"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Plain text anchor with default, muted or danger style and optional new-tab external icon; pick it for an inline link, not a router navigation."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "href"
            bind: "Link__href"
          - $type: "FieldText"
            label: "label"
            bind: "Link__label"
          - $type: "Switch"
            label: "external"
            bind: "Link__external"
          - $type: "FieldSelect"
            label: "variant"
            bind: "Link__variant"
            options:
              - value: "default"
                label: "default"
              - value: "muted"
                label: "muted"
              - value: "danger"
                label: "danger"
      - $type: "Link"
        href: "$vars.Link__href"
        label: "$vars.Link__label"
        external: "$vars.Link__external"
        variant: "$vars.Link__variant"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `href` | string | yes |\n| `label` | string | yes |\n| `external` | boolean | no |\n| `variant` | default / muted / danger | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "PageTabs"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Tablist whose selected tab can live in the component, be controlled, or be stored in a URL search param; pick it over Tabs when the tab must survive reload or be linked."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: tabs)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `tabs` | array | yes |\n| `activeTab` | string | no |\n| `urlParam` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "RouterProvider"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Provider that gives descendants router navigation and URL search param read/write, built on react-router; required by components using urlParam."
      - $type: "Markdown"
        text: "_No node schema shipped for RouterProvider: no controls, no live render yet._"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Stepper"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Multi-step wizard with numbered progress circles, Back/Next navigation and a final completion button; pick it for a sequential flow."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: steps)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `steps` | array | yes |\n| `completedLabel` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "Tabs"
      - $type: "Tag"
        label: "disposition"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Tablist with keyboard navigation and content per tab, uncontrolled by default or controlled via value; pick it over PageTabs when no URL persistence is needed."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: tabs)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `tabs` | array | yes |\n| `defaultTab` | string | no |\n| `value` | string | no |"
  - $type: "Card"
    header:
      - $type: "Tag"
        label: "TreeView"
      - $type: "Tag"
        label: "composite"
      - $type: "Tag"
        label: "navigation"
    items:
      - $type: "Markdown"
        text: "Expandable hierarchical list with keyboard navigation, single selection and controlled or uncontrolled expansion; pick it for nested data."
      - $type: "Markdown"
        text: "_Not playable yet (required props without a sample: nodes)._"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `nodes` | array | yes |\n| `selectedId` | string | no |\n| `defaultExpandedIds` | array | no |\n| `expandedIds` | array | no |"
