        label: "ActionButton"
      - $type: "Tag"
        label: "atomic"
      - $type: "Tag"
        label: "controls"
    items:
      - $type: "Markdown"
        text: "Button that runs a named `$actions` entry from anywhere on a page; use instead of ButtonAction when the page runner should dispatch the request and track pending state."
      - $type: "HorizontalStack"
        wrap: true
        items:
          - $type: "FieldText"
            label: "action"
            bind: "ActionButton__action"
          - $type: "FieldText"
            label: "label"
            bind: "ActionButton__label"
          - $type: "Switch"
            label: "iconOnly"
            bind: "ActionButton__iconOnly"
          - $type: "FieldSelect"
            label: "variant"
            bind: "ActionButton__variant"
            options:
              - value: "primary"
                label: "primary"
              - value: "secondary"
                label: "secondary"
              - value: "danger"
                label: "danger"
              - value: "danger-outline"
                label: "danger-outline"
              - value: "success"
                label: "success"
              - value: "neutral"
                label: "neutral"
              - value: "ghost"
                label: "ghost"
          - $type: "FieldSelect"
            label: "size"
            bind: "ActionButton__size"
            options:
              - value: "sm"
                label: "sm"
              - value: "md"
                label: "md"
          - $type: "Switch"
            label: "disabled"
            bind: "ActionButton__disabled"
      - $type: "ActionButton"
        action: "$vars.ActionButton__action"
        label: "$vars.ActionButton__label"
        iconOnly: "$vars.ActionButton__iconOnly"
        variant: "$vars.ActionButton__variant"
        size: "$vars.ActionButton__size"
        disabled: "$vars.ActionButton__disabled"
      - $type: "Markdown"
        text: "| Prop | Type | Required |\n|---|---|---|\n| `action` | string | yes |\n| `label` | string | yes |\n| `params` | record | no |\n| `body` | record | no |\n| `icon` | string | no |\n| `iconOnly` | boolean | no |\n| `variant` | primary / secondary / danger / danger-outline / success / neutral / ghost | no |\n| `size` | sm / md | no |\n| `disabled` | boolean | no |\n| `disabledReason` | string | no |\n| `actionPending` | record | no |"
